name: Kernel uptime probe

on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'uptime_probe.py'
      - 'tools/uptime_probe.py'
      - '.github/workflows/uptime.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency: uptime

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ask the health endpoint
        env:
          UPTIME_TARGET: https://almanac-carbon-babied.ngrok-free.dev
        run: |
          if [ -f tools/uptime_probe.py ]; then
            python3 tools/uptime_probe.py
          else
            python3 uptime_probe.py
          fi

      - name: Keep the result in the repository
        run: |
          git add uptime.json
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git config user.name "kernel-uptime"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "uptime: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push
